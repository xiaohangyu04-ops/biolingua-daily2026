<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BioLingua Daily v12</title>
<style>
:root{--ink:#3f493f;--green:#6f8f70;--line:#e2eadf;--paper:#fffef9;--shadow:0 16px 44px rgba(84,106,84,.10)}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Georgia,"Noto Serif SC","Times New Roman",serif;color:var(--ink);background:linear-gradient(180deg,#f9fcf7,#f3f9f5 50%,#edf6f5)}
a{color:#57765b;text-decoration:none}.env{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.water{position:absolute;left:0;right:0;bottom:0;height:270px;background:linear-gradient(180deg,rgba(225,242,245,.04),rgba(194,226,233,.60),rgba(145,196,207,.88))}
.wave{position:absolute;left:-20%;width:140%;border-radius:48% 52% 0 0/100% 100% 0 0;animation:move 14s ease-in-out infinite alternate}.w1{height:75px;bottom:170px;background:rgba(239,249,250,.55)}.w2{height:100px;bottom:100px;background:rgba(211,236,242,.48);animation-duration:18s}.w3{height:130px;bottom:20px;background:rgba(172,214,224,.42);animation-duration:22s}@keyframes move{from{transform:translateX(-2%)}to{transform:translateX(2%) translateY(10px)}}.layout{position:relative;z-index:1}
header{position:sticky;top:0;z-index:20;background:rgba(249,252,248,.83);backdrop-filter:blur(15px);border-bottom:1px solid #e5eee2}.head,.bar,.main{max-width:1220px;margin:auto}.head{padding:18px 24px 12px;display:flex;justify-content:space-between;gap:20px}.brand h1{margin:0;color:#607f63;font-size:34px}.brand small{color:#869282}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:10px 16px;border:1px solid #dce8d9;background:#fff;border-radius:999px;color:#677561;cursor:pointer}.tab.active{background:#91af8e;color:#fff}.bar{padding:8px 24px 15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button,textarea{font:inherit;border:1px solid #dbe7d8;background:#fff;border-radius:12px;padding:9px 11px;color:#566154}button{cursor:pointer}.status{padding:9px 12px;background:#f4faf1;border:1px solid #dbe7d8;border-radius:12px}
.main{padding:28px 24px 105px}.hero,.card,.focus-card,.review-card{background:rgba(255,255,251,.96);border:1px solid var(--line);box-shadow:var(--shadow)}.hero{border-radius:26px;padding:26px 28px}.date-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.date{font-size:29px;font-weight:bold;color:#678368}.pill{padding:7px 12px;border-radius:999px;background:#edf6e9;color:#6c896c}.hero p{line-height:1.9;color:#6f786d}.section-title{margin:28px 0 12px;display:flex;gap:12px;align-items:center;color:#80917f;letter-spacing:2px}.section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#dce9d9,transparent)}
.daily-focus{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.focus-card{border-radius:18px;padding:15px 17px}.focus-card .en{font-weight:bold;font-size:18px}.focus-card .cn{margin-top:6px;color:#7a8578}.focus-card .use{margin-top:8px;font-size:13px;color:#8c9788}
.card{position:relative;border-radius:24px;padding:28px;margin:18px 0}.rank{position:absolute;left:-15px;top:-15px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#a3c19d;color:#fff;font-weight:bold}.card h2{font-size:29px;line-height:1.28;margin:0 0 6px}.zh-title{font-size:18px;color:#788676;margin-bottom:10px}.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:#7d8679}.source{background:#f0f7ed;border:1px solid #dfe9db;padding:5px 10px;border-radius:999px}.news-brief{margin-top:16px;border:1px solid #e4ebe1;background:#fffefa;border-radius:18px;padding:16px 18px}.news-brief h3{margin:0 0 12px;color:#668067}.brief-point{padding:11px 0;border-bottom:1px dashed #e6ece3}.brief-point:last-child{border-bottom:0}.brief-en{font-weight:bold;line-height:1.65}.brief-zh{margin-top:4px;color:#7b8579}.summary{margin-top:16px;padding:15px 17px;border-left:4px solid #bed6b9;background:#fbfef9;border-radius:0 14px 14px 0;line-height:1.9}.expert{margin-top:14px;padding:20px;border:1px solid #dfe9dc;background:linear-gradient(180deg,#fbfef9,#f8fbf6);border-radius:18px}.expert h3{margin:0 0 10px;color:#668067}.expert p{margin:0;line-height:1.92}.sentences{display:grid;gap:10px}.sentence{border:1px solid #e4ebe1;background:#fffefa;border-radius:16px;padding:14px 16px}.sentence .en{font-size:18px;font-weight:bold;line-height:1.6}.sentence .cn{margin-top:6px;color:#7a8578}.sentence .note{margin-top:7px;font-size:13px;color:#8a9588}.vocab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}.vocab{border:1px solid #e3ece0;background:#f8fbf6;border-radius:15px;padding:13px}.vocab b{font-size:18px}.tiny{font-size:13px;color:#849080;line-height:1.65}.action{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.saved{background:#eef6eb}
iframe.ted{width:100%;aspect-ratio:16/9;border:0;border-radius:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.block{border:1px solid #e3ece0;background:#fafdf8;border-radius:17px;padding:15px 17px}.block h4{margin:0 0 9px;color:#6e876e}textarea{width:100%;min-height:180px;resize:vertical}.hidden{display:none!important}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.stat{background:#fbfef9;border:1px solid #e1eadf;border-radius:15px;padding:13px 17px}.stat b{display:block;font-size:24px;color:#668066}.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.review-card{border-radius:17px;padding:16px}
@media(max-width:900px){.daily-focus,.grid2{grid-template-columns:1fr}}@media(max-width:700px){.head{flex-direction:column}.head,.bar,.main{padding-left:15px;padding-right:15px}.card{padding:21px 17px}.card h2{font-size:23px}}
</style></head>
<body><div class="env"><div class="water"></div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div></div>
<div class="layout"><header><div class="head"><div class="brand"><h1>BioLingua Daily</h1><small>医药前沿 × 中英精读 × 每日英语 × TED 真日更</small></div><div class="tabs"><button class="tab active" data-view="news">行业精读</button><button class="tab" data-view="ted">TED</button><button class="tab" data-view="review">单词本 · 感悟</button></div></div><div class="bar"><label>日期 <select id="dateSelect"></select></label><label>发音 <select id="voice"><option value="en-US">US English</option><option value="en-GB">UK English</option></select></label><button id="speakDaily">朗读今日英语重点</button><span class="status" id="status">载入中…</span></div></header>
<main class="main">
<section id="newsView"><div class="hero"><div class="date-row"><div class="date" id="dateTitle">—</div><span class="pill">True Daily · Deduplicated</span></div><p id="brief"></p><div class="section-title">每日英语重点 · Daily English Focus</div><div class="daily-focus" id="dailyFocus"></div></div><div class="section-title">今日医药前沿 · TOP 5</div><div id="newsCards"></div></section>
<section id="tedView" class="hidden"><div class="hero"><div class="date-row"><div class="date">TED · 今日不重复</div><span class="pill">Unique Daily Talk</span></div><p>TED 直接写入当天 JSON；已经学过的 slug 会记录在历史文件中，不再重复选择。</p></div><div id="tedContent"></div></section>
<section id="reviewView" class="hidden"><div class="hero"><div class="date-row"><div class="date">单词本 · 感悟</div><span class="pill">Spaced Review</span></div><p>收藏词汇与 TED 感悟保存在浏览器本地。</p></div><div class="stats" id="stats"></div><div class="review-grid" id="reviewBox"></div><div class="section-title">TED 感悟记录</div><div id="notesList"></div></section>
</main></div>
<script>
const $=s=>document.querySelector(s),VK='bio_v12_vocab',NK='bio_v12_notes';let state={date:null,data:null};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function daycn(d){return ['周日','周一','周二','周三','周四','周五','周六'][new Date(d+'T12:00:00').getDay()]}
function today(){return new Date().toISOString().slice(0,10)}
function st(){try{return JSON.parse(localStorage.getItem(VK)||'{}')}catch{return {}}}function ss(x){localStorage.setItem(VK,JSON.stringify(x))}
function nt(){try{return JSON.parse(localStorage.getItem(NK)||'{}')}catch{return {}}}function ns(x){localStorage.setItem(NK,JSON.stringify(x))}
async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p);return r.json()}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=$('#voice').value;u.rate=.9;speechSynthesis.speak(u)}window.speak=speak;
function k(w){return w.toLowerCase().trim()}function saveWord(v,source){const s=st(),q=k(v.word);if(s[q])delete s[q];else s[q]={...v,source,due:today()};ss(s);renderNews();renderReview()}
async function init(){const m=await j('data/manifest.json'),dates=[...m.dates].reverse();$('#dateSelect').innerHTML=dates.map(d=>`<option value="${d}">${d} · ${daycn(d)}</option>`).join('');await loadDate(dates[0])}
async function loadDate(d){state.date=d;$('#status').textContent='载入中…';state.data=await j(`data/${d}.json`);$('#dateTitle').textContent=`${d} · ${daycn(d)}`;$('#brief').textContent=state.data.daily_brief||'';renderFocus();renderNews();renderTed();renderReview();$('#status').textContent='已载入'}
function renderFocus(){$('#dailyFocus').innerHTML=(state.data.daily_english||[]).map((x,i)=>`<div class="focus-card"><div class="en">${esc(x.en)}</div><div class="cn">${esc(x.zh)}</div><div class="use">${esc(x.use)}</div><button class="f" data-i="${i}" style="margin-top:9px">▶ 朗读</button></div>`).join('');document.querySelectorAll('.f').forEach(b=>b.onclick=()=>speak(state.data.daily_english[Number(b.dataset.i)].en))}
function renderNews(){const saved=st();$('#newsCards').innerHTML=(state.data.items||[]).map((x,i)=>`<article class="card"><div class="rank">${i+1}</div><h2>${esc(x.title_en)}</h2><div class="zh-title">${esc(x.title_zh)}</div><div class="meta"><span class="source">${esc(x.source)}</span><span>${esc(x.category)}</span><a href="${x.url}" target="_blank">原文 ↗</a><button class="h" data-i="${i}">▶ 标题</button></div><div class="news-brief"><h3>新闻内容速览 · Quick Brief</h3>${(x.brief_points||[]).map((p,n)=>`<div class="brief-point"><div class="brief-en">${n+1}. ${esc(p.en)}</div><div class="brief-zh">${esc(p.zh)}</div></div>`).join('')}</div><div class="summary"><b>双语摘要 · Bilingual Summary</b><br><b>EN:</b> ${esc(x.summary_en)}<br><b>中:</b> ${esc(x.summary_zh)}</div><div class="expert"><h3>专家解读 · Expert Perspective</h3><p>${esc(x.expert_analysis)}</p></div><div class="section-title">新闻好句 · Key Sentences</div><div class="sentences">${(x.key_sentences||[]).map((s,n)=>`<div class="sentence"><div class="en">${esc(s.en)}</div><div class="cn">${esc(s.zh)}</div><div class="note">${esc(s.note||'')}</div><button class="ks" data-i="${i}" data-n="${n}" style="margin-top:9px">▶ 朗读英文</button></div>`).join('')}</div><div class="section-title">专业词汇 · Vocabulary</div><div class="vocab-grid">${(x.vocab||[]).map(v=>`<div class="vocab"><b>${esc(v.word)}</b> · ${esc(v.zh)}<div class="tiny">${esc(v.note)}</div><div class="action"><button class="ws" data-w="${encodeURIComponent(v.word)}">发音</button><button class="wv ${saved[k(v.word)]?'saved':''}" data-v="${encodeURIComponent(JSON.stringify(v))}" data-s="${encodeURIComponent(x.source)}">${saved[k(v.word)]?'★ 已收藏':'☆ 收藏'}</button></div></div>`).join('')}</div></article>`).join('')||'<div class="card">今天没有抓到新的不重复新闻。</div>';document.querySelectorAll('.h').forEach(b=>b.onclick=()=>speak(state.data.items[+b.dataset.i].title_en));document.querySelectorAll('.ks').forEach(b=>b.onclick=()=>speak(state.data.items[+b.dataset.i].key_sentences[+b.dataset.n].en));document.querySelectorAll('.ws').forEach(b=>b.onclick=()=>speak(decodeURIComponent(b.dataset.w)));document.querySelectorAll('.wv').forEach(b=>b.onclick=()=>saveWord(JSON.parse(decodeURIComponent(b.dataset.v)),decodeURIComponent(b.dataset.s)))}
function saveTed(){const t=state.data.ted,all=nt();all[state.date+'__'+t.slug]={date:state.date,title:t.title,text:$('#tedNote').value.trim(),updated:new Date().toISOString()};ns(all);renderReview();alert('已保存')}window.saveTed=saveTed;
function renderTed(){const t=state.data.ted;if(!t){$('#tedContent').innerHTML='<div class="card">今天没有可用的新 TED；系统不会用旧 TED 冒充新内容。</div>';return}const old=(nt()[state.date+'__'+t.slug]||{}).text||'';$('#tedContent').innerHTML=`<article class="card"><h2>${esc(t.title)}</h2><div class="zh-title">${esc(t.zh||'')}</div><div class="meta"><span class="source">${esc(t.speaker)}</span><a href="https://www.ted.com/talks/${t.slug}" target="_blank">TED 页面 ↗</a></div><iframe class="ted" src="https://embed.ted.com/talks/${t.slug}" allowfullscreen></iframe><div class="summary"><b>EN:</b> ${esc(t.summary_en||'')}<br><b>中:</b> ${esc(t.summary_zh||'')}</div><div class="section-title">TED 好句 · Key Sentences</div>${(t.key_sentences||[]).map(s=>`<div class="sentence"><div class="en">${esc(s.en)}</div><div class="cn">${esc(s.zh)}</div><button onclick='speak(${JSON.stringify(s.en)})' style="margin-top:9px">▶ 朗读</button></div>`).join('')}<div class="section-title">Shadowing</div>${(t.shadowing||[]).map(s=>`<div class="sentence"><div class="en">${esc(s)}</div><button onclick='speak(${JSON.stringify(s)})' style="margin-top:9px">▶ 跟读</button></div>`).join('')}<div class="section-title">我的感悟</div><textarea id="tedNote">${esc(old)}</textarea><div class="action"><button onclick="saveTed()">保存感悟</button></div></article>`}
function renderReview(){const s=st(),items=Object.entries(s).map(([k,v])=>({k,...v}));$('#stats').innerHTML=`<div class="stat"><b>${items.length}</b>收藏词</div><div class="stat"><b>${Object.keys(nt()).length}</b>TED 感悟</div>`;$('#reviewBox').innerHTML=items.map(x=>`<div class="review-card"><span class="source">${esc(x.source)}</span><h3>${esc(x.word)}</h3><div>${esc(x.zh)}</div><div class="tiny">${esc(x.note)}</div><button onclick='speak(${JSON.stringify(x.word)})'>发音</button></div>`).join('')||'<div class="card">还没有收藏词。</div>';$('#notesList').innerHTML=Object.values(nt()).sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).map(n=>`<div class="card"><h3>${esc(n.title)}</h3><div class="tiny">${esc(n.date)}</div><div class="summary">${esc(n.text)}</div></div>`).join('')||'<div class="card">暂无 TED 感悟。</div>'}
function sw(v){['news','ted','review'].forEach(x=>document.getElementById(x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>sw(b.dataset.view));$('#dateSelect').onchange=e=>loadDate(e.target.value);$('#speakDaily').onclick=()=>speak((state.data.daily_english||[]).map(x=>x.en).join('. '));init().catch(e=>{$('#status').textContent='载入失败';console.error(e)})
</script></body></html>
